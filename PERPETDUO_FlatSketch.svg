      .detail { fill: none; stroke: #1a2a4a; stroke-width: 1; }
      .heating { fill: #c4922a; opacity: 0.15; stroke: #c4922a; stroke-width: 1; stroke-dasharray: 6,3; }
      .reflect { fill: none; stroke: #b0b0b0; stroke-width: 4; opacity: 0.6; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 11px; fill: #1a2a4a; }
      .label-bold { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #1a2a4a; font-weight: bold; }
      .label-sm { font-family: Helvetica, Arial, sans-serif; font-size: 9px; fill: #666; }
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 22px; fill: #1a2a4a; font-weight: bold; letter-spacing: 3px; }
      .subtitle { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #c4922a; }
      .callout-line { stroke: #c4922a; stroke-width: 1; fill: none; }
      .callout-dot { fill: #c4922a; }
      .zip { stroke: #1a2a4a; stroke-width: 2.5; fill: none; }
      .zip-teeth { stroke: #999; stroke-width: 1; fill: none; stroke-dasharray: 2,2; }
      .pocket { fill: none; stroke: #1a2a4a; stroke-width: 1.5; }
      .magnet { fill: #c4922a; opacity: 0.5; }
      .collar-fill { fill: #e8ecf2; stroke: #1a2a4a; stroke-width: 2; }
      .body-fill { fill: #f0f3f8; stroke: #1a2a4a; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
