  <text x="120" y="625" class="label" fill="#c4922a">MAX LOAD:</text>
  <text x="220" y="625" class="label">4 kg (2×2 kg)</text>

  <text x="120" y="645" class="label" fill="#c4922a">HEATING:</text>
